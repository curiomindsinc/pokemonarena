<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monster Arena</title>
<style>
  :root {
    --bg: #140c24;
    --panel: #23173b;
    --panel-edge: #4a3a72;
    --ink: #f3ecff;
    --muted: #a99cc8;
    --red: #ff7b54;
    --blue: #5ab8ff;
    --hp-col: #5ee08a;
    --hp-low: #ff5a5a;
    --gold: #ffd34d;
    --stage-w: min(calc(100vw - 32px), calc((100vh - 150px) * 528 / 360));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #2a1a4a 0%, var(--bg) 70%);
    color: var(--ink);
    font: 600 13px/1.3 "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; overflow: hidden; user-select: none;
  }
  .bar { width: var(--stage-w); display: flex; align-items: center; gap: 12px; }

  /* --- top: health plates --- */
  .plate {
    flex: 1; background: var(--panel); border: 2px solid var(--panel-edge); border-radius: 6px;
    padding: 6px 10px; display: grid; grid-template-columns: 1fr auto; gap: 3px 8px;
  }
  .plate .name { letter-spacing: .08em; }
  .plate.p .name { color: var(--red); }
  .plate.r .name { color: var(--blue); }
  .plate .tier { color: var(--muted); font-size: 11px; justify-self: end; }
  .hp {
    grid-column: 1 / -1; height: 9px; border-radius: 3px; background: #0d0718; position: relative; overflow: hidden;
    --hp: 1; --trail: 1;
  }
  .hp::before, .hp::after { content: ""; position: absolute; inset: 0; transform-origin: left; }
  .hp::before { background: #fff3; transform: scaleX(var(--trail)); }
  .hp::after { background: var(--hp-col); transform: scaleX(var(--hp)); }
  .plate.r .hp::before, .plate.r .hp::after { transform-origin: right; }
  .hp.low::after { background: var(--hp-low); }
  .hpn { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 11px; }
  .vs { text-align: center; width: 150px; }
  .vs b { display: block; font-size: 18px; color: var(--gold); letter-spacing: .15em; }
  #level { font-size: 10px; color: var(--hp-low); }
  #level.same { color: var(--hp-col); }

  /* --- stage --- */
  .stage { position: relative; width: var(--stage-w); aspect-ratio: 528 / 360; }
  #game {
    width: 100%; height: 100%; display: block; image-rendering: pixelated;
    border: 2px solid var(--panel-edge); border-radius: 6px; cursor: none; background: #000;
  }
  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    background: rgba(12, 6, 24, .72); border-radius: 6px;
  }
  .overlay[hidden] { display: none; }
  .card { background: var(--panel); border: 2px solid var(--panel-edge); border-radius: 8px; padding: 20px 26px; max-width: 420px; }
  .card h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: .12em; color: var(--gold); }
  .card p { margin: 0 0 14px; color: var(--muted); }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; text-align: left; margin: 0 0 16px; }
  kbd {
    display: inline-block; min-width: 22px; padding: 1px 6px; border-radius: 4px; text-align: center;
    background: #0d0718; border: 1px solid var(--panel-edge); color: var(--ink); font: inherit; font-size: 11px;
  }
  .btn {
    font: inherit; font-size: 15px; letter-spacing: .1em; color: #1a0d2e; background: var(--gold);
    border: 0; border-radius: 6px; padding: 10px 22px; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.1); }
  .card .btn { display: block; margin: 0 auto; }
  #result-title { font-size: 28px; letter-spacing: .1em; margin: 0 0 6px; }
  #result-title.win { color: var(--gold); }
  #result-title.lose { color: var(--hp-low); }

  /* --- bottom: move slots --- */
  .moves { justify-content: center; gap: 8px; }
  .slot {
    --cd: 0; position: relative; width: 92px; padding: 6px 4px 5px; border-radius: 6px; text-align: center;
    background: var(--panel); border: 2px solid var(--panel-edge); overflow: hidden;
  }
  .slot::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: conic-gradient(rgba(8, 4, 16, .78) calc(var(--cd) * 360deg), transparent 0);
  }
  .slot.ready { border-color: var(--gold); }
  .slot.special.ready { box-shadow: 0 0 10px #ff9a2e88; }
  .slot .k { font-size: 10px; color: var(--muted); }
  .slot .n { font-size: 12px; }
  .slot.deny { animation: deny .25s; }
  .slot.locked { border-color: #ff3a3a66; }
  .slot.locked .n { text-decoration: line-through; opacity: .55; }
  /* Mind Lock: cooldown frozen */
  .slot.frozen { border-color: #ff70d8; box-shadow: 0 0 10px #ff70d888; }
  .slot.frozen .n { text-decoration: line-through; opacity: .55; }
  .slot.frozen::before { content: "\1F512"; position: absolute; top: 2px; right: 4px; font-size: 11px; z-index: 1; }
  @keyframes deny {
    25% { transform: translateX(-3px); border-color: var(--hp-low); }
    75% { transform: translateX(3px); border-color: var(--hp-low); }
  }
  .plate .diff { font-size: 10px; color: var(--muted); margin-left: 6px; letter-spacing: .1em; }
  .diff-label { font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
  .diffs { display: inline-flex; gap: 4px; padding: 3px; background: #0d0718; border: 1px solid var(--panel-edge); border-radius: 7px; margin-bottom: 16px; }
  .diffs button {
    font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 0; border-radius: 5px;
    padding: 6px 14px; cursor: pointer;
  }
  .diffs button:hover { color: var(--ink); }
  .diffs button[aria-pressed="true"] { background: var(--panel-edge); color: var(--ink); }
  .diffs button[data-diff="easy"][aria-pressed="true"] { box-shadow: inset 0 -2px 0 var(--hp-col); }
  .diffs button[data-diff="normal"][aria-pressed="true"] { box-shadow: inset 0 -2px 0 var(--gold); }
  .diffs button[data-diff="hard"][aria-pressed="true"] { box-shadow: inset 0 -2px 0 var(--hp-low); }
  .hint { margin: 8px 0 0 !important; font-size: 11px; }
  .err { color: var(--hp-low); white-space: pre-wrap; }

  /* --- monster pick --- */
  .overlay { overflow: auto; }
  #start .card { max-width: 820px; padding: 16px 22px; }
  #start .card p { margin-bottom: 10px; }
  /* top row: the two picks + the controls for your pick */
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; text-align: left; }
  .pickcard {
    display: grid; justify-items: center; gap: 2px; width: 92px; padding: 6px 4px 5px; flex: none;
    font: inherit; font-size: 11px; color: var(--ink); background: #0d0718; border: 2px solid var(--panel-edge); border-radius: 7px; cursor: pointer;
  }
  .pickcard .who { font-size: 10px; letter-spacing: .12em; color: var(--muted); }
  .pickcard.p.active { border-color: var(--red); box-shadow: 0 0 10px #ff7b5466; }
  .pickcard.r.active { border-color: var(--blue); box-shadow: 0 0 10px #5ab8ff66; }
  .vsmall { color: var(--gold); font-weight: 700; letter-spacing: .1em; flex: none; }
  .top .keys { flex: 1; margin: 0 0 0 8px; font-size: 11px; gap: 3px 10px; padding-left: 12px; border-left: 1px solid var(--panel-edge); }
  .step { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; color: var(--muted); }
  .step b { color: var(--red); }
  .step.r b { color: var(--blue); }
  /* one shared roster: a column per evolution line, a row per stage */
  .roster { display: grid; gap: 3px; padding: 3px; margin: 0 auto 12px; width: max-content; background: #0d0718; border: 1px solid var(--panel-edge); border-radius: 7px; }
  .roster button {
    position: relative; display: grid; justify-items: center; gap: 1px; padding: 3px 2px 4px; width: 66px;
    font: inherit; font-size: 10px; color: var(--muted); background: transparent; border: 0; border-radius: 5px; cursor: pointer;
  }
  .roster button:hover { color: var(--ink); background: #ffffff0d; }
  .roster button:disabled { visibility: hidden; }
  .roster button[aria-pressed="true"] { background: var(--panel-edge); color: var(--ink); }
  /* who has picked it: red underline = you, blue = rival */
  .roster button.pick-p { box-shadow: inset 0 -2px 0 var(--red); }
  .roster button.pick-r { box-shadow: inset 0 -2px 0 var(--blue); }
  .roster button.pick-p.pick-r { box-shadow: inset 0 -2px 0 var(--red), inset 0 -4px 0 var(--blue); }
  .mon { display: block; width: 40px; height: 40px; border-radius: 4px; background-repeat: no-repeat; image-rendering: pixelated; }
  /* rival palette preview (matches assets.js): hue shift by default */
  .rival-tint .mon { filter: hue-rotate(185deg) saturate(1.2); }
  /* rock line rival is rust red-brown, not hue-rotated (rust()) */
  .rival-tint .mon:is([data-id="geodude"], [data-id="graveler"], [data-id="golem"]) { filter: sepia(0.7) saturate(1.8) hue-rotate(-20deg); }
  /* dragon line rival is shiny-style (shiny()): blue to pink, orange to green */
  .rival-tint .mon:is([data-id="dratini"], [data-id="dragonair"], [data-id="dragonite"]) { filter: hue-rotate(70deg); }
  .rival-tint .mon.random, .mon.random { filter: none; background: #23173b; display: grid; place-items: center; font-size: 20px; color: var(--muted); }
  .bottom { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .bottom .diff-label, .bottom .diffs { margin: 0; }
  #start .card .bottom .btn { margin: 0; }
  .keys .role { color: var(--muted); font-weight: 400; }
  .link { display: block; margin: 10px auto 0; font: inherit; font-size: 12px; color: var(--muted); background: none; border: 0; cursor: pointer; text-decoration: underline; }
  .link:hover { color: var(--ink); }
</style>
</head>
<body>
  <div class="bar">
    <div class="plate p">
      <span class="name" id="name-p">CHARMANDER</span><span class="tier" id="tier-p">TIER 0</span>
      <div class="hp" id="hp-p"></div><span class="hpn" id="hpn-p">100</span>
    </div>
    <div class="vs"><b>VS</b><span id="level"></span></div>
    <div class="plate r">
      <span class="name"><span id="name-r">RIVAL</span> <span class="diff" id="diff-r">NORMAL</span></span><span class="tier" id="tier-r">TIER 0</span>
      <div class="hp" id="hp-r"></div><span class="hpn" id="hpn-r">100</span>
    </div>
  </div>

  <div class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="start">
      <div class="card">
        <h1>MONSTER ARENA</h1>
        <p>Attacks only land when both monsters stand at the same height.</p>
        <div class="top">
          <button type="button" class="pickcard p" data-side="p" aria-label="Change your monster"><span class="who">YOU</span><span class="slot-mon"></span><span class="nm"></span></button>
          <span class="vsmall">VS</span>
          <button type="button" class="pickcard r rival-tint" data-side="r" aria-label="Change rival monster"><span class="who">RIVAL</span><span class="slot-mon"></span><span class="nm"></span></button>
          <div class="keys" id="keys"></div>
        </div>
        <div class="step" id="pick-step"></div>
        <div class="roster" id="roster" role="group" aria-label="Monsters"></div>
        <div class="bottom">
          <div class="diff-label">Rival difficulty</div>
          <div class="diffs" role="group" aria-label="Rival difficulty">
            <button type="button" data-diff="easy">Easy</button>
            <button type="button" data-diff="normal">Normal</button>
            <button type="button" data-diff="hard">Hard</button>
          </div>
          <button class="btn">CLICK TO FIGHT</button>
        </div>
      </div>
    </div>
    <div class="overlay" id="result" hidden>
      <div class="card">
        <h2 id="result-title"></h2>
        <div class="diff-label">Rival difficulty</div>
        <div class="diffs" role="group" aria-label="Rival difficulty">
          <button type="button" data-diff="easy">Easy</button>
          <button type="button" data-diff="normal">Normal</button>
          <button type="button" data-diff="hard">Hard</button>
        </div>
        <button class="btn" id="rematch">REMATCH</button>
        <button class="link" id="change">change monsters</button>
        <p class="hint">or press <kbd>R</kbd></p>
      </div>
    </div>
  </div>

  <div class="bar moves">
    <div class="slot" data-move="light"><div class="k">LMB</div><div class="n">Scratch</div></div>
    <div class="slot" data-move="heavy"><div class="k">RMB</div><div class="n">Ember</div></div>
    <div class="slot special" data-move="special"><div class="k">LMB + RMB</div><div class="n">Flamethrower</div></div>
    <div class="slot" data-move="dash"><div class="k">SHIFT</div><div class="n">Dash</div></div>
    <div class="slot" data-move="jump"><div class="k">SPACE</div><div class="n">Jump</div></div>
  </div>

  <script>
    if (location.protocol === 'file:') {
      document.querySelector('#start .card').innerHTML =
        '<h1>MONSTER ARENA</h1><p>Browsers block this game when opened as a file.</p>' +
        '<p>In this folder run <kbd>node serve.js</kbd><br>then open <kbd>http://localhost:8080</kbd></p>';
    }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
